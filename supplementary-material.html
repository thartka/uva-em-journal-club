<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplementary Material - UVA Emergency Medicine Journal Club</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .supp-main { margin-top: 10px; }
        .paper-link {
            display: block;
            padding: 20px;
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
            margin-bottom: 28px;
        }
        .paper-link:hover {
            border-color: #E57200;
            background-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        }
        .paper-eyebrow {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #E57200;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .paper-title { font-size: 1.15rem; color: #232D4B; font-weight: 600; margin-bottom: 8px; }
        .paper-cite { font-size: 0.9rem; color: #666; }

        figure.supp-figure { margin: 0; }
        figure.supp-figure img {
            width: 100%;
            max-width: 760px;
            height: auto;
            display: block;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        figure.supp-figure figcaption {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-top: 12px;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header" style="flex-direction: column; align-items: flex-start;">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h1 style="width: 100%; text-align: center; margin-top: 15px; margin-bottom: 0;">Supplementary Material</h1>
        </header>

        <main class="supp-main">
            <a class="paper-link"
               href="https://www.sciencedirect.com/science/article/pii/S0735675726001257?via%3Dihub"
               target="_blank" rel="noopener noreferrer">
                <div class="paper-eyebrow">American Journal of Emergency Medicine</div>
                <div class="paper-title">Fall height and impact surface in relation to clinically important traumatic brain injury among children under two years</div>
                <div class="paper-cite">Oishi, Amagasa, Uematsu, Moriya. Am J Emerg Med. 2026;104:79–84. doi:10.1016/j.ajem.2026.03.002</div>
            </a>

            <figure class="supp-figure">
                <img src="static/ciTBI%20vs%20fall%20height.png"
                     alt="Estimated probability of clinically important TBI versus fall height">
                <figcaption>Estimated probability of clinically important TBI (ciTBI) by fall height. Figure produced by Thomas Hartka.</figcaption>
            </figure>
        </main>
    </div>
</body>
</html>
