<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 — What a p-value means</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Question 1 of 4</h1>
            <a href="index.html" class="back-link">← Module home</a>
        </header>

        <div class="step-indicator">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
        </div>

        <div id="question-container"></div>

        <section id="interactive" class="interactive" hidden>
            <h2 class="interactive-heading">See it: the shaded tail is the p-value</h2>
            <div id="mount"></div>
        </section>
    </div>

    <script src="js/stats.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/pvalue-curve.js"></script>
    <script>
        PValueQuestions.render(
            document.getElementById('question-container'),
            'q1',
            {
                nextHref: 'q2-coin.html',
                nextLabel: 'Next question →',
                onReveal: () => {
                    const area = document.getElementById('interactive');
                    area.hidden = false;
                    new PValueCurve(document.getElementById('mount'));
                    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        );
    </script>
</body>
</html>
