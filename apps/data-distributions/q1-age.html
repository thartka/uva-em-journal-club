<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - Data Distributions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Question 1 of 2</h1>
            <a href="index.html" class="back-link">← Module home</a>
        </header>

        <div class="step-indicator">
            <span class="step-dot done"></span>
            <span class="step-dot done"></span>
            <span class="step-dot done"></span>
            <span class="step-dot done"></span>
            <span class="step-dot done"></span>
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
        </div>

        <div id="question-container"></div>

        <section id="interactive" class="interactive" hidden>
            <h2 class="interactive-heading">See it: the interval runs off the edge of the possible</h2>
            <p class="interactive-intro">
                A right-skewed pediatric age distribution with mean ± SD and mean ± 2 SD
                drawn across it. The lower end of the interval runs off the left edge of the
                ages a patient can have.
            </p>
            <div id="mount"></div>
        </section>
    </div>

    <script src="js/rng.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/skew-whiskers.js"></script>
    <script>
        DistributionQuestions.render(
            document.getElementById('question-container'),
            'q1',
            {
                nextHref: 'q2-bimodal.html',
                nextLabel: 'Next question →',
                onReveal: () => {
                    const area = document.getElementById('interactive');
                    area.hidden = false;
                    new SkewWhiskers('mount');
                    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        );
    </script>
</body>
</html>
